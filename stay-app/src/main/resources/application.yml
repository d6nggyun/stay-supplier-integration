spring:
  application:
    name: stay

  # H2 file 모드: clone 후 추가 설치 없이 첫 실행 시 ./data/stay.mv.db 생성.
  # AUTO_SERVER=TRUE로 앱 실행 중 H2 콘솔 등 다른 연결도 허용한다.
  datasource:
    url: jdbc:h2:file:./data/stay;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 개발 편의용 H2 콘솔 (http://localhost:8080/h2-console). 운영 기능 아님.
  h2:
    console:
      enabled: true

# 공급사 연동 설정. 두 공급사 모두 Mock(포트 9090)을 호출하며, 경로(/a/**, /b/**)로 구분한다.
supplier:
  a:
    base-url: http://localhost:9090
    api-key: mock-api-key
  b:
    base-url: http://localhost:9090
    api-key: mock-api-key
  sync:
    # 숙소 목록은 실시간성이 필요 없어 시간 단위로 충분하다. 기본 1시간.
    # 주기 스케줄러의 첫 실행이 기동 직후 초기 적재를 겸한다.
    interval-ms: 3600000
    enabled: true
  # 검색 견고성. 값은 잠정이며 Mock 무응답 시나리오로 검증해 운영에서 튜닝한다.
  search:
    connect-timeout-ms: 1000     # 연결 타임아웃(커넥터)
    response-timeout-ms: 3000    # 응답 타임아웃(청크 호출당)
    request-budget-ms: 6000      # 전체 요청 예산(공급사당 상한)
    chunk-size: 50               # 재고·요금 조회 1회 최대 코드 수(규약상 최대 50)
    chunk-concurrency: 4         # 청크 동시 호출 상한
