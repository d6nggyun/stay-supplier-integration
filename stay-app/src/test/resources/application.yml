spring:
  # 테스트는 파일 DB를 건드리지 않도록 내장(in-memory) H2로 격리한다.
  # @DataJpaTest는 기본으로 내장 H2로 대체되지만, @SpringBootTest도 여기서 덮어 파일 생성을 막는다.
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

# 테스트 application.yml은 메인 것을 대체하므로(클래스패스 우선), supplier 설정도 자립적으로 둔다.
# enabled=false로 스케줄 동기화가 컨텍스트 로딩 시 외부(Mock)를 호출하지 않게 한다.
supplier:
  a:
    base-url: http://localhost:9090
    api-key: test-key
  b:
    base-url: http://localhost:9090
    api-key: test-key
  sync:
    interval-ms: 3600000
    enabled: false
  search:
    connect-timeout-ms: 1000
    response-timeout-ms: 3000
    request-budget-ms: 6000
    chunk-size: 50
    chunk-concurrency: 4
  resilience:
    retry:
      max-attempts: 3
      wait-duration-ms: 200
      backoff-multiplier: 2.0
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 10
      wait-duration-in-open-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
