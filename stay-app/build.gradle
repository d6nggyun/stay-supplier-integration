plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

group = 'd6nggyun'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// CVE-2025-48924: springdoc(swagger-core)를 통해 유입되는 commons-lang3 3.17.0의
// 제어되지 않은 재귀(StackOverflow) 취약점. Spring Boot 관리 버전을 수정본(3.18.0)으로 올린다.
ext['commons-lang3.version'] = '3.18.0'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// WebClient 용도로만 webflux를 둔다. 실행은 web(MVC/서블릿)로 하고, 웹 타입은 application.yml에서 servlet으로 고정한다.
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	// 재시도·서킷 브레이커. 스프링 스타터 대신 필요한 모듈만(리액터 연산자 방식).
	implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
	// 연동 지표·모니터링(Micrometer + Actuator, Prometheus 노출). Resilience4j 지표 바인딩 포함.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.github.resilience4j:resilience4j-micrometer:2.2.0'
	// 요금/재고 캐시(인프로세스, single-flight·시간/크기 축출).
	implementation 'com.github.ben-manes.caffeine:caffeine'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
